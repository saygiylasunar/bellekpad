name: BellekPad Static Checks

on:
  push:
    branches: [main, "wip/g0.6a-selection-core"]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "scripts/**"
      - "src/editor/**"
      - "tests/**"
      - ".github/workflows/static-checks.yml"
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check src/editor/g06a-selection.mjs
      - name: Static DOM integration
        run: node scripts/check-contract.mjs
      - name: G0.6A editor selection regression tests
        run: node --test tests/g06a-selection.test.mjs
